name: havenwood
description: "Havenwood - a cerebral restoration puzzle adventure."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#070B13"
    theme_color: "#0C1422"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
